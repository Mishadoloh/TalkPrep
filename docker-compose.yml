version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: talkprep-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nextjs-gateway
    networks:
      - talkprep-network
    restart: always

  nextjs-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talkprep-gateway
    environment:
      - NODE_ENV=production
      - PORT=3005
      - AUTH_SERVICE_URL=http://auth-service:3010
      - AI_SERVICE_URL=http://ai-service:3020
      - BILLING_SERVICE_URL=http://billing-service:3030
      - JWT_SECRET=super-secure-production-jwt-secret-key-12345
      - SESSION_SECRET=super-secure-production-session-aes-256-key-1234567
    networks:
      - talkprep-network
    restart: always

  auth-service:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: talkprep-auth-service
    volumes:
      - ./services/auth:/app
    networks:
      - talkprep-network
    restart: always

  ai-service:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    container_name: talkprep-ai-service
    environment:
      - AUTH_SERVICE_URL=http://auth-service:3010
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./services/ai:/app
    networks:
      - talkprep-network
    restart: always

  billing-service:
    build:
      context: ./services/billing
      dockerfile: Dockerfile
    container_name: talkprep-billing-service
    environment:
      - AUTH_SERVICE_URL=http://auth-service:3010
    volumes:
      - ./services/billing:/app
    networks:
      - talkprep-network
    restart: always

networks:
  talkprep-network:
    driver: bridge
